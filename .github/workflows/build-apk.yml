name: Build MaxmudBank APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Flutter WebView App
        run: |
          flutter create --org com.maxmudbank --project-name maxmudbank app
          mkdir -p app/assets
          cp index.html app/assets/index.html
          cat << 'EOF' > app/pubspec.yaml
          name: maxmudbank
          description: MaxmudBank
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.7.0
          flutter:
            uses-material-design: true
            assets:
              - assets/index.html
          EOF
          cat << 'EOF' > app/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MaterialApp(
            debugShowCheckedModeBanner: false,
            home: MaxmudBankWeb(),
          ));

          class MaxmudBankWeb extends StatefulWidget {
            const MaxmudBankWeb({super.key});
            @override
            State<MaxmudBankWeb> createState() => _MaxmudBankWebState();
          }

          class _MaxmudBankWebState extends State<MaxmudBankWeb> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0B1020))
                ..loadFlutterAsset('assets/index.html');
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0B1020),
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          EOF
      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: MaxmudBank-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          
