name: Build MaxmudBank APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web folder for Capacitor
        run: |
          mkdir -p www
          cp -r index.html style.css app.js www/ 2>/dev/null || cp -r *.html *.css *.js www/ 2>/dev/null || true

      - name: Setup Capacitor and Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init MaxmudBank com.maxmudbank.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MaxmudBank-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
