name: Build MaxmudBank APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/maxmudbank/app app/src/main/res/values gradle/wrapper
          printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nnetworkTimeout=10000\nvalidateDistributionUrl=true\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > gradle/wrapper/gradle-wrapper.properties
          printf "#!/usr/bin/env sh\nexec gradle \"\$@\"\n" > gradlew
          chmod +x gradlew
          printf "rootProject.name = \"MaxmudBank\"\ninclude ':app'\n" > settings.gradle
          printf "buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }\n}\nallprojects {\n  repositories { google(); mavenCentral() }\n}\n" > build.gradle
          printf "plugins {\n  id 'com.android.application'\n}\nandroid {\n  namespace \"com.maxmudbank.app\"\n  compileSdk 34\n  defaultConfig {\n    applicationId \"com.maxmudbank.app\"\n    minSdk 23\n    targetSdk 34\n    versionCode 1\n    versionName \"1.0\"\n  }\n  buildTypes {\n    release {\n      minifyEnabled false\n    }\n  }\n}\ndependencies {\n  implementation 'androidx.appcompat:appcompat:1.6.1'\n  implementation 'androidx.webkit:webkit:1.10.0'\n}\n" > app/build.gradle
          printf "<resources>\n  <string name=\"app_name\">MaxmudBank</string>\n</resources>\n" > app/src/main/res/values/strings.xml
          printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n  <uses-permission android:name=\"android.permission.INTERNET\" />\n  <application android:label=\"@string/app_name\" android:usesCleartextTraffic=\"true\" android:theme=\"@style/Theme.AppCompat.Light.NoActionBar\">\n    <activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\">\n      <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml
          printf "package com.maxmudbank.app;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity {\n  private WebView webView;\n  private static final String APP_URL = \"https://muxammadeyvmaxmud001-bit.github.io/MaxmudBank/\";\n  @Override\n  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    webView = new WebView(this);\n    setContentView(webView);\n    WebSettings s = webView.getSettings();\n    s.setJavaScriptEnabled(true);\n    s.setDomStorageEnabled(true);\n    s.setDatabaseEnabled(true);\n    s.setMediaPlaybackRequiresUserGesture(false);\n    webView.setWebViewClient(new WebViewClient());\n    webView.loadUrl(APP_URL);\n  }\n  @Override\n  public void onBackPressed() {\n    if (webView != null && webView.canGoBack()) webView.goBack();\n    else super.onBackPressed();\n  }\n}\n" > app/src/main/java/com/maxmudbank/app/MainActivity.java
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxmudBank-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
