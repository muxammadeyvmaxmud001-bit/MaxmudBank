}
#app{

.pitch-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(8,127,120,.12);color:var(--brand2);font-size:10px;font-weight:800;letter-spacing:.4px}
.pitch-pill i{width:6px;height:6px;border-radius:50%;background:var(--brand2);display:inline-block;animation:pulse 1.6s infinite}

.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;position:relative}

.hero-card{

}

.hero-top,.hero-bottom{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.hero-brand{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.3px}
.brand-mark{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--acc);color:#091e3a;font-weight:900;font-size:14px}

.hero-bottom{border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.hero-bottom small{display:block;font-size:8px;letter-spacing:1.1px;opacity:.7;margin-bottom:3px}
.hero-bottom b{font-size:12px;letter-spacing:1px}
.card-copy{font-size:10px;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;font-weight:700}
.hero-orb{position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%;z-index:0}
.orb-one{width:190px;height:190px;right:-54px;top:15px}
.orb-two{width:135px;height:135px;right:-25px;top:43px}

.ai-banner{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:18px;margin-bottom:18px;

  border:1px solid rgba(8,127,120,.22);text-align:left;width:100%;
}
.ai-badge{width:36px;height:36px;border-radius:12px;background:var(--brand2);color:#fff;display:grid;place-items:center;font-size:17px;flex:none}
.ai-banner div{flex:1;min-width:0}
.ai-banner b{display:block;font-size:12px;font-weight:800;color:var(--ink)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 1px 10px}
.section-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.3px}
.section-head>span{font-size:10px;color:var(--mut);font-weight:700}
.text-link{color:var(--brand2);font-weight:800;font-size:11px;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 20px}
.act{background:var(--surf);border-radius:16px;padding:12px 4px;min-height:80px;text-align:center;font-size:10px;font-weight:700;border:1px solid var(--line);color:var(--ink);box-shadow:0 4px 12px rgba(15,41,74,.03);line-height:1.3}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 20px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;box-shadow:0 4px 14px rgba(15,41,74,.03);min-width:0}

h2{font-size:16px;font-weight:800;letter-spacing:-.3px;margin:6px 0 10px}

.row{display:flex;align-items:center;gap:11px;padding:12px 14px;min-height:62px;border-bottom:1px solid var(--line);width:100%;text-align:left}

.ic{width:38px;height:38px;border-radius:12px;background:var(--bg);color:var(--brand2);display:grid;place-items:center;font-size:17px;flex:none}
.row .t{flex:1;min-width:0}

.pos{color:var(--ok);font-weight:800;font-size:12.5px}
.neg{color:var(--ink);font-weight:800;font-size:12.5px}
.empty{padding:24px 16px;text-align:center;color:var(--mut);font-size:12px}

label{display:block;font-weight:700;font-size:11px;margin:14px 0 6px;color:var(--mut)}

.btn{width:100%;margin-top:16px;padding:14px 16px;border-radius:14px;background:linear-gradient(110deg,#12375f,#087f78);box-shadow:0 8px 18px rgba(8,127,120,.18);color:#fff;font-weight:800;font-size:14px}
.btn.sec{background:var(--surf);color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:10px}

.hd button{font-size:26px;color:var(--brand2);padding:2px 10px 2px 0}
.hd h2{margin:0;font-size:18px}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 0}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-weight:700;font-size:11px}
.chip.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.card{background:linear-gradient(135deg,var(--brand),#0a2240);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-shadow:0 12px 26px rgba(10,34,64,.16)}

.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--acc));border-radius:6px}

.score-box{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}

.score-badge{padding:4px 10px;border-radius:99px;background:rgba(5,150,105,.12);color:var(--ok);font-weight:800;font-size:11px}

.qrc{text-align:center;color:var(--mut);font-size:11px;line-height:1.45}

.rr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}

nav{flex:none;display:flex;min-height:64px;padding:5px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surf);box-shadow:0 -6px 20px rgba(15,41,74,.04)}

.switch{width:44px;height:25px;border-radius:20px;background:var(--line);padding:3px;flex:none}
.switch i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0003;transition:transform .2s}
.switch.on{background:var(--brand2)}
.switch.on i{transform:translateX(19px)}

.sheet-backdrop{
  position:absolute;inset:0;background:rgba(7,15,29,.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;z-index:50;animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;background:var(--surf);border-radius:24px 24px 0 0;padding:18px 20px 26px;
  border-top:1px solid var(--line);box-shadow:0 -12px 40px rgba(0,0,0,.22);animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(30px)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.toast{
  position:absolute;top:14px;left:16px;right:16px;z-index:60;padding:12px 14px;border-radius:14px;
  background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;
  box-shadow:0 10px 28px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:space-between;
  animation:slideDown .2s ease;
}
@keyframes slideDown{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}

@media print{
  body{background:#fff}
  #app{box-shadow:none;border:0;max-width:100%;height:auto}
  nav,.topbar,.btn,.chip,input,select{display:none!important}

@media(min-width:700px){

  #app{height:min(880px,calc(100dvh - 32px));border-radius:28px;border:1px solid var(--line)}
}
</style>
